name: Build RUI3 (salaa) Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch'
        type: string
        default: 'lineage-23.2-bakasu'
      enable_ksu:
        description: 'Enable KernelSU'
        type: boolean
        default: false
      ksu_variant:
        description: 'KernelSU variant (only if enabled)'
        type: choice
        options: [KernelSU-Next, RKSU, xxKSU, SukiSU, BakaSU]
        default: 'BakaSU'
      enable_susfs:
        description: 'Enable SUSFS (not supported by xxKSU). Mode picks the driver; without KSU only the patch is applied, no KSU driver.'
        type: boolean
        default: false
      susfs_mode:
        description: 'SUSFS driver: with the KSU driver, or patch-only (no KSU driver)'
        type: choice
        options: [with_ksu, without_ksu]
        default: 'with_ksu'
      custom_note:
        description: 'Note added to the Telegram message'
        type: string
        default: ''
      notify_telegram:
        description: 'Telegram: auto (on when secrets exist), on, off'
        type: choice
        options: [auto, on, off]
        default: 'auto'

# All configurable inputs are passed through `env`, never interpolated into
# scripts: a note like "it's done" would otherwise break the shell.
env:
  ARCH: arm64
  SUBARCH: arm64
  LC_ALL: C
  KERNEL_REPO: https://github.com/EvilAnsh/android_kernel_realme_salaa.git
  CLANG_REPO: https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git
  ANYKERNEL_REPO: https://github.com/kardebayan/AnyKernel3.git
  DEFCONFIG: salaa_defconfig
  BRANCH: ${{ inputs.kernel_branch }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  KSU: ${{ inputs.enable_ksu }}
  VARIANT: ${{ inputs.ksu_variant }}
  SUSFS: ${{ inputs.enable_susfs }}
  SUSFS_MODE: ${{ inputs.susfs_mode }}
  NOTE: ${{ inputs.custom_note }}
  NOTIFY: ${{ inputs.notify_telegram }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Notify Telegram — Build Started
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.NOTIFY != 'off'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }
          label="$VARIANT"; [ "$KSU" = true ] || label=Stock
          [ "$SUSFS" = true ] && label="$label + SUSFS"

          msg=$(mktemp)
          {
            printf '🔨 *Build Started — salaa*\n────────────────────\n'
            printf '🔧 *Variant* `%s`\n' "$(esc "$label")"
            printf '🌿 *Branch*  `%s`\n' "$(esc "$BRANCH")"
            [ -z "$NOTE" ] || printf '📝 *Note*    %s\n' "$(esc "$NOTE")"
            printf '────────────────────\n[🔗 View Run](%s)\n' "$RUN_URL"
          } > "$msg"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=MarkdownV2 -d disable_web_page_preview=true \
            --data-urlencode "text@${msg}"

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache libelf-dev libfdt-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          # A changing key would store a new cache every run. The branch keeps
          # builds apart; ccache validates each object against its inputs.
          key: ccache-salaa-${{ inputs.kernel_branch }}
          restore-keys: ccache-salaa-

      - name: Configure ccache
        run: |
          # ccache 4 defaults to ~/.cache/ccache; point it at the cached path.
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache --max-size=5G
          ccache --set-config=compression=true --set-config=compression_level=1

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 "$KERNEL_REPO" -b "$BRANCH" kernel
          cd kernel
          {
            echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)"
            echo "KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo unknown)"
          } >> "$GITHUB_ENV"

      - name: Cache Clang Toolchain
        id: clang
        uses: actions/cache@v6
        with:
          path: clang
          key: clang-r547379

      - name: Clone Clang Toolchain
        if: steps.clang.outputs.cache-hit != 'true'
        run: git clone --depth=1 "$CLANG_REPO" clang

      - name: Clone AnyKernel3
        run: git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel

      - name: Resolve KernelSU variant
        run: |
          case "$VARIANT" in
            KernelSU-Next)
              KSU_REPO=https://github.com/KernelSU-Next/KernelSU-Next
              if [ "$SUSFS" = true ]; then
                # EvilAnsh's pinned ksun.sh carries the SUSFS patches.
                KSU_SETUP_URL=https://gist.githubusercontent.com/EvilAnsh/a57e99f5d8a8e7d22a59874d99752893/raw/443ecfa83c06821a26c58ca943cec9eda9c95264/ksun.sh
                KSU_BRANCH=legacy-susfs-v2
              else
                KSU_SETUP_URL=$KSU_REPO/raw/legacy/kernel/setup.sh KSU_BRANCH=legacy
              fi ;;
            RKSU)
              KSU_REPO=https://github.com/rsuntk/KernelSU
              KSU_SETUP_URL=$KSU_REPO/raw/main/kernel/setup.sh
              [ "$SUSFS" = true ] && KSU_BRANCH=susfs-rksu-master || KSU_BRANCH=main ;;
            SukiSU)
              KSU_REPO=https://github.com/SukiSU-Ultra/SukiSU-Ultra
              KSU_SETUP_URL=$KSU_REPO/raw/main/kernel/setup.sh
              [ "$SUSFS" = true ] && KSU_BRANCH=main || KSU_BRANCH=builtin ;;
            xxKSU)
              KSU_REPO=https://github.com/backslashxx/KernelSU
              KSU_SETUP_URL=$KSU_REPO/raw/master/kernel/setup.sh KSU_BRANCH=master
              [ "$SUSFS" = true ] && { echo "::warning::xxKSU has no SUSFS, flag ignored"; SUSFS=false; } ;;
            BakaSU)
              KSU_REPO=https://github.com/Baka-SU/BakaSU
              KSU_SETUP_URL=$KSU_REPO/raw/main/kernel/setup.sh KSU_BRANCH=main ;;
            *) echo "::error::unknown ksu_variant '$VARIANT'"; exit 1 ;;
          esac
          {
            echo "KSU_VARIANT=$VARIANT"
            echo "KSU_REPO=$KSU_REPO"
            echo "KSU_BRANCH=$KSU_BRANCH"
            echo "KSU_SETUP_URL=$KSU_SETUP_URL"
            echo "SUSFS_ENABLED=$SUSFS"
          } >> "$GITHUB_ENV"

      - name: Setup KernelSU
        if: inputs.enable_ksu
        working-directory: kernel
        run: |
          # /OWNER/REPO/BRANCH/path is no longer served by github.com (it
          # returns "Not Found"), so the setup scripts are fetched from /raw/.
          curl -LSsf "$KSU_SETUP_URL" -o /tmp/ksu-setup.sh
          # Never hand a failed fetch to bash: it would run the error text.
          head -c2 /tmp/ksu-setup.sh | grep -qx '#!' ||
            { echo "::error::$KSU_SETUP_URL did not return a shell script"; head -3 /tmp/ksu-setup.sh; exit 1; }
          bash /tmp/ksu-setup.sh "$KSU_BRANCH"

      - name: Configure Build Variant
        run: |
          if [ "$KSU" != true ]; then
            {
              echo "KSU_VARIANT=Stock"
              echo "SUSFS_ENABLED=false"
              echo "SUSFS_DRIVER_MODE=none"
            } >> "$GITHUB_ENV"
          elif [ "$SUSFS" = true ]; then
            [ "$SUSFS_MODE" = without_ksu ] && mode=no_ksu_driver || mode=with_ksu_driver
            echo "SUSFS_DRIVER_MODE=$mode" >> "$GITHUB_ENV"
          fi

      - name: Get KSU Commit Info
        if: inputs.enable_ksu
        run: echo "KSU_COMMIT=$(git ls-remote "${KSU_REPO}.git" "$KSU_BRANCH" | cut -f1 | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build Kernel
        working-directory: kernel
        run: |
          start=$(date +%s)
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export KBUILD_BUILD_USER=EvilAnsh KBUILD_BUILD_HOST=GitHub-Actions

          make O=out ARCH=${ARCH} ${DEFCONFIG}
          make -j$(nproc) O=out ARCH=${ARCH} CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log

          echo "BUILD_DURATION=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ccache --show-stats

      - name: Check Build Output
        working-directory: kernel
        run: |
          image=out/arch/arm64/boot/Image.gz
          [ -f "$image" ] || { echo "::error::Image.gz not found, build failed"; exit 1; }
          echo "IMAGE_SIZE_MB=$(echo "scale=2; $(stat -c%s "$image") / 1048576" | bc)" >> "$GITHUB_ENV"

      - name: Package with AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel/

          if [ "$KSU" != true ]; then
            [ "$SUSFS_ENABLED" = true ] && tag=SUSFS_Standalone || tag=Stock
          elif [ "$SUSFS_ENABLED" != true ]; then
            tag=$KSU_VARIANT
          elif [ "$SUSFS_DRIVER_MODE" = no_ksu_driver ]; then
            tag=$KSU_VARIANT-SUSFS_NoDriver
          else
            tag=$KSU_VARIANT-SUSFS
          fi
          name="Stormbreaker-salaa-$tag-$(date +%Y%m%d-%H%M)"

          # Stored type comes from the extension: .zipx is served as a plain
          # file, so the artifact is never re-wrapped or auto-extracted.
          repo_root=$PWD
          (cd AnyKernel && zip -qr9 "$repo_root/$tag.zip" . -x '*.git*')
          mv "$repo_root/$tag.zip" "$repo_root/$tag.zipx"
          {
            echo "ZIP_NAME=$name.zip"
            echo "ZIP_PATH=$repo_root/$tag.zipx"
            echo "ARTIFACT_NAME=$name-pkg"
          } >> "$GITHUB_ENV"

      - name: Upload Kernel Artifact
        # archive: false uploads the zip as-is, with no wrapper.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ZIP_PATH }}
          archive: false
          retention-days: 30

      - name: Send Kernel ZIP to Telegram
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.NOTIFY != 'off'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }

          caption=$(mktemp)
          {
            printf '✅ *Build Successful — salaa*\n────────────────────\n`%s`\n\n' "$(esc "$ZIP_NAME")"
            printf '📱 *Device*     `Realme 7/Narzo 20 Pro/Narzo 30 4G \(salaa\)`\n'
            printf '🔩 *Kernel*     `%s`\n' "$(esc "$KERNEL_VERSION")"
            printf '🌿 *Branch*     `%s`\n' "$(esc "$BRANCH")"
            printf '🔖 *Commit*     `%s`\n' "$(esc "$KERNEL_COMMIT")"
            printf '📦 *Image size* `%s MB`\n' "$IMAGE_SIZE_MB"
            printf '⏱ *Build time* `%dm %ds`\n' $((BUILD_DURATION / 60)) $((BUILD_DURATION % 60))
            printf '\n'

            if [ "$KSU_VARIANT" = Stock ]; then
              printf '🛡 *KernelSU*  `Stock \(No root\)`\n'
            else
              printf '🛡 *KernelSU*\n'
              printf '   • *Variant* `%s`\n' "$(esc "$KSU_VARIANT")"
              printf '   • *Branch*  `%s`\n' "$(esc "$KSU_BRANCH")"
              printf '   • *Commit*  `%s`\n' "$(esc "$KSU_COMMIT")"
              if [ "$SUSFS_ENABLED" != true ]; then
                printf '   • *SUSFS*   `Disabled`\n'
              elif [ "$SUSFS_DRIVER_MODE" = no_ksu_driver ]; then
                printf '   • *SUSFS*   `Enabled \(No KSU driver\)`\n'
              else
                printf '   • *SUSFS*   `Enabled \(With KSU driver\)`\n'
              fi
              if [ "$KSU_VARIANT" = BakaSU ]; then
                printf '   • *Manager* [Download](https://t.me/BakaSU_grp/4)\n'
                printf '   • *Spoofed* [Download](https://t.me/BakaSU_grp/5)\n'
              else
                printf '   • *Manager* [Download](%s)\n' "$KSU_REPO/releases/latest"
              fi
            fi

            [ -n "$NOTE" ] && printf '\n📝 *Note* %s\n' "$(esc "$NOTE")"
            printf '\n────────────────────\n[🔗 View Run](%s)\n' "$RUN_URL"
          } > "$caption"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" -F parse_mode=MarkdownV2 \
            -F "caption=<${caption}" -F "document=@${ZIP_PATH};filename=${ZIP_NAME}"

      - name: Send Failure Notification to Telegram
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' && env.NOTIFY != 'off'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }
          label="$VARIANT"; [ "$KSU" = true ] || label=Stock

          msg=$(mktemp)
          {
            printf '❌ *Build Failed — salaa*\n────────────────────\n'
            printf '🔧 *Variant* `%s`\n' "$(esc "$label")"
            printf '🌿 *Branch*  `%s`\n' "$(esc "$BRANCH")"
            printf '🔖 *Commit*  `%s`\n' "$(esc "${KERNEL_COMMIT:-N/A}")"
            [ -n "$NOTE" ] && printf '📝 *Note*    %s\n' "$(esc "$NOTE")"
            printf '────────────────────\n[🔍 View Logs](%s)\n' "$RUN_URL"
          } > "$msg"

          if [ -f kernel/build.log ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" -F parse_mode=MarkdownV2 \
              -F "caption=<${msg}" -F "document=@kernel/build.log"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=MarkdownV2 -d disable_web_page_preview=true \
              --data-urlencode "text@${msg}"
          fi
