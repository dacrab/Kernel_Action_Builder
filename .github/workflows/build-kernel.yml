name: Build RUI3 (salaa) Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        type: string
        default: 'lineage-23.2-bakasu'

      enable_ksu:
        description: 'Enable KernelSU'
        required: true
        type: boolean
        default: false

      ksu_variant:
        description: 'KernelSU Variant (only if KSU enabled)'
        required: false
        type: choice
        options:
          - 'KernelSU-Next'
          - 'RKSU'
          - 'xxKSU'
          - 'SukiSU'
          - 'BakaSU'
        default: 'BakaSU'

      enable_susfs:
        description: 'Enable SUSFS (KernelSU-Next / RKSU / SukiSU / BakaSU only)'
        required: false
        type: boolean
        default: false

      susfs_mode:
        description: 'SUSFS Mode — with KSU driver (KSU+SUSFS) or standalone (SUSFS only, no KSU)'
        required: false
        type: choice
        options:
          - 'with_ksu'
          - 'without_ksu'
        default: 'with_ksu'

      custom_note:
        description: 'Custom build note (optional)'
        required: false
        default: ''

      notify_telegram:
        description: 'Telegram notifications: auto (on when secrets are set), on, or off'
        required: false
        type: choice
        options:
          - 'auto'
          - 'on'
          - 'off'
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ARCH: arm64
      SUBARCH: arm64
      LC_ALL: C
      KERNEL_REPO: "https://github.com/EvilAnsh/android_kernel_realme_salaa.git"
      CLANG_REPO: "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git"
      ANYKERNEL_REPO: "https://github.com/kardebayan/AnyKernel3.git"
      ANYKERNEL_BRANCH: "master"
      DEFCONFIG: "salaa_defconfig"

    steps:
      - name: Notify Telegram — Build Started
        if: (env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') && github.event.inputs.notify_telegram != 'off'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VARIANT="${{ github.event.inputs.ksu_variant }}"
          if [ "${{ github.event.inputs.enable_ksu }}" != "true" ]; then
            VARIANT="Stock"
          fi

          SUSFS_TAG=""
          if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            if [ "${{ github.event.inputs.enable_ksu }}" == "true" ]; then
              if [ "${{ github.event.inputs.susfs_mode }}" == "without_ksu" ]; then
                SUSFS_TAG=" \\+ SUSFS \\(No KSU driver\\)"
              else
                SUSFS_TAG=" \\+ SUSFS"
              fi
            else
              SUSFS_TAG=" \\+ SUSFS \\(Standalone\\)"
            fi
          fi

          NOTE="${{ github.event.inputs.custom_note }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Escape special MarkdownV2 chars in variable fields
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }
          VARIANT_ESC=$(esc "${VARIANT}${SUSFS_TAG}")
          BRANCH_ESC=$(esc "${{ github.event.inputs.kernel_branch }}")

          MSG_FILE=$(mktemp)
          printf "🔨 *Build Started — salaa*\n"              >> "$MSG_FILE"
          printf "━━━━━━━━━━━━━━━━━━━━\n"                     >> "$MSG_FILE"
          printf "📱 *Device*   \`Realme 7/Narzo 20 Pro/Narzo 30 4G \(salaa\)\`\n"      >> "$MSG_FILE"
          printf "🔧 *Variant*  \`%s\`\n" "${VARIANT_ESC}"    >> "$MSG_FILE"
          printf "🌿 *Branch*   \`%s\`\n" "${BRANCH_ESC}"     >> "$MSG_FILE"

          if [ -n "$NOTE" ]; then
            NOTE_ESC=$(esc "$NOTE")
            printf "📝 *Note*    %s\n" "${NOTE_ESC}"          >> "$MSG_FILE"
          fi

          printf "━━━━━━━━━━━━━━━━━━━━\n"                     >> "$MSG_FILE"
          printf "[🔗 View Run](%s)\n" "${RUN_URL}"            >> "$MSG_FILE"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true \
            --data-urlencode "text@${MSG_FILE}"

          rm -f "$MSG_FILE"

      - name: Checkout Workflow Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # ── 2. Build dependencies ─────────────────────────────────────────────────
      # ubuntu-24.04 already ships gcc, g++, make, bison, flex, libssl-dev, zip,
      # unzip, curl, wget, time and clang — only the genuine gaps are installed.
      # (clang/lld from the toolchain below still take precedence via PATH.)
      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc ccache libelf-dev libfdt-dev python3

      # ── 3. ccache ──────────────────────────────────────────────────────────────
      # CCACHE_DIR must match the path restored below; ccache 4.x would otherwise
      # default to ~/.cache/ccache and the cache would never be hit.
      - name: Cache ccache
        id: cache-ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-salaa-${{ runner.os }}-${{ hashFiles('.github/workflows/build-kernel.yml') }}
          restore-keys: |
            ccache-salaa-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          ccache --show-config | grep -i cache_dir

      # ── 4. Kernel source ───────────────────────────────────────────────────────
      - name: Clone Kernel Source
        run: |
          git clone --depth=1 "$KERNEL_REPO" -b "${{ github.event.inputs.kernel_branch }}" kernel
          cd kernel
          echo "KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo 'unknown')" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${{ github.event.inputs.kernel_branch }}" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ── 5. Clang toolchain ─────────────────────────────────────────────────────
      - name: Cache Clang Toolchain
        uses: actions/cache@v6
        id: cache-clang
        with:
          path: clang
          key: clang-r547379

      - name: Clone Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 "$CLANG_REPO" clang

      # ── 6. AnyKernel3 ──────────────────────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          # Cloned unconditionally: the cache can restore a stale tree, and a
          # restored directory would make `git clone` fail on "already exists".
          git clone --depth=1 "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH" AnyKernel

      # ── 7. KernelSU variant ───────────────────────────────────────────────────
      # One step instead of five: each variant only differs in the setup script,
      # the branch it reports, and how it handles the SUSFS flag.
      #
      # The setup itself runs as its own step below. Keeping it separate means a
      # failing `curl | bash` (a non-zero exit from the upstream script) is
      # reported on its own, instead of aborting the variant bookkeeping too.
      - name: Resolve KernelSU variant
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.ksu_variant }}"
          WITH_SUSFS="${{ github.event.inputs.enable_susfs }}"

          # Setup scripts are fetched from `/raw/`. The shorter
          # `/OWNER/REPO/BRANCH/path` form is no longer served by github.com —
          # it returns a 9-byte "Not Found", which `curl | bash` then tries to
          # run as a command called `Not`.
          case "$VARIANT" in
            KernelSU-Next)
              REPO="https://github.com/KernelSU-Next/KernelSU-Next"
              if [ "$WITH_SUSFS" = "true" ]; then
                # EvilAnsh's pinned ksun.sh carries the SUSFS patches.
                URL="https://gist.githubusercontent.com/EvilAnsh/a57e99f5d8a8e7d22a59874d99752893/raw/443ecfa83c06821a26c58ca943cec9eda9c95264/ksun.sh"
                BRANCH="legacy-susfs-v2"
              else
                URL="$REPO/raw/legacy/kernel/setup.sh"
                BRANCH="legacy"
              fi
              ARG="$BRANCH"
              ;;
            RKSU)
              REPO="https://github.com/rsuntk/KernelSU"
              URL="$REPO/raw/main/kernel/setup.sh"
              if [ "$WITH_SUSFS" = "true" ]; then BRANCH="susfs-rksu-master"; else BRANCH="main"; fi
              ARG="$BRANCH"
              ;;
            SukiSU)
              REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              URL="$REPO/raw/main/kernel/setup.sh"
              if [ "$WITH_SUSFS" = "true" ]; then BRANCH="main"; else BRANCH="builtin"; fi
              ARG="$BRANCH"
              ;;
            xxKSU)
              REPO="https://github.com/backslashxx/KernelSU"
              URL="$REPO/raw/master/kernel/setup.sh"
              BRANCH="master"
              ARG="master"
              ;;
            BakaSU)
              REPO="https://github.com/Baka-SU/BakaSU"
              URL="$REPO/raw/main/kernel/setup.sh"
              BRANCH="main"
              ARG="sync-susfs"
              ;;
            *)
              echo "::error::unknown ksu_variant '$VARIANT'"; exit 1 ;;
          esac

          # xxKSU never supports SUSFS; every other variant follows the input.
          if [ "$VARIANT" = "xxKSU" ]; then
            [ "$WITH_SUSFS" = "true" ] && echo "::warning::xxKSU does not support SUSFS — flag ignored."
            WITH_SUSFS=false
          fi

          {
            echo "KSU_VARIANT=$VARIANT"
            echo "KSU_REPO=$REPO"
            echo "KSU_BRANCH=$BRANCH"
            echo "SUSFS_ENABLED=$WITH_SUSFS"
            echo "KSU_SETUP_URL=$URL"
            echo "KSU_SETUP_ARG=$ARG"
          } >> "$GITHUB_ENV"

      - name: Setup KernelSU — ${{ github.event.inputs.ksu_variant }}
        if: github.event.inputs.enable_ksu == 'true'
        working-directory: kernel
        run: |
          curl -LSsf "$KSU_SETUP_URL" -o /tmp/ksu-setup.sh
          # A failed fetch must never reach bash: it would execute the error text.
          head -c2 /tmp/ksu-setup.sh | grep -qx '#!' ||
            { echo "::error::$KSU_SETUP_URL did not return a shell script"; head -3 /tmp/ksu-setup.sh; exit 1; }
          bash /tmp/ksu-setup.sh "$KSU_SETUP_ARG"

      # ── 8. SUSFS driver mode / stock fallback ─────────────────────────────────
      - name: Configure Build Variant
        run: |
          if [ "${{ github.event.inputs.enable_ksu }}" = "false" ]; then
            echo "KSU_VARIANT=Stock"      >> $GITHUB_ENV
            echo "SUSFS_ENABLED=false"    >> $GITHUB_ENV
            echo "SUSFS_DRIVER_MODE=none" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            if [ "${{ github.event.inputs.susfs_mode }}" = "without_ksu" ]; then
              echo "SUSFS_DRIVER_MODE=no_ksu_driver"   >> $GITHUB_ENV
            else
              echo "SUSFS_DRIVER_MODE=with_ksu_driver" >> $GITHUB_ENV
            fi
          fi

      # ── 9. Fetch KSU commit info ──────────────────────────────────────────────
      - name: Get KSU Commit Info
        if: github.event.inputs.enable_ksu == 'true'
        run: |
          # KSU_REPO and KSU_BRANCH are set by the variant steps above
          KSU_COMMIT=$(git ls-remote "${KSU_REPO}.git" "${KSU_BRANCH}" | cut -f1 | cut -c1-7)
          echo "KSU_COMMIT=${KSU_COMMIT}" >> $GITHUB_ENV

      # ── 10. Build ──────────────────────────────────────────────────────────────
      - name: Build Kernel
        id: build_kernel
        working-directory: kernel
        run: |
          set -e
          start_time=$(date +%s)

          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="EvilAnsh"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          mkdir -p out
          make O=out ARCH=${ARCH} ${DEFCONFIG}
          make -j$(nproc --all) O=out \
              ARCH=${ARCH} \
              CC="ccache clang" \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee build.log

          BUILD_DURATION=$(( $(date +%s) - start_time ))
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV
          ccache --show-stats

      # ── 11. Verify output ──────────────────────────────────────────────────────
      - name: Check Build Output
        working-directory: kernel
        run: |
          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz not found — build failed."
            exit 1
          fi
          IMAGE_SIZE_MB=$(echo "scale=2; $(stat -c%s out/arch/arm64/boot/Image.gz) / 1048576" | bc)
          echo "IMAGE_SIZE_MB=${IMAGE_SIZE_MB}" >> $GITHUB_ENV

      # ── 12. Package with AnyKernel3 ───────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          rm -f AnyKernel/Image.gz AnyKernel/*.zip

          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel/

          cd AnyKernel
          TIMESTAMP=$(date +"%Y%m%d-%H%M")

          if [ "${{ github.event.inputs.enable_ksu }}" == "true" ]; then
            if [ "${SUSFS_ENABLED}" == "true" ]; then
              if [ "${SUSFS_DRIVER_MODE}" == "no_ksu_driver" ]; then
                ZIP_NAME="Stormbreaker-salaa-${KSU_VARIANT}-SUSFS_NoDriver-${TIMESTAMP}"
              else
                ZIP_NAME="Stormbreaker-salaa-${KSU_VARIANT}-SUSFS-${TIMESTAMP}"
              fi
            else
              ZIP_NAME="Stormbreaker-salaa-${KSU_VARIANT}-${TIMESTAMP}"
            fi
          elif [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
            # Standalone SUSFS without any KSU driver
            ZIP_NAME="Stormbreaker-salaa-SUSFS_Standalone-${TIMESTAMP}"
          else
            ZIP_NAME="Stormbreaker-salaa-Stock-${TIMESTAMP}"
          fi

          zip -r9 "${ZIP_NAME}.zip" . -x '*.git*' > /dev/null 2>&1

          echo "ZIP_NAME=${ZIP_NAME}"     >> $GITHUB_ENV
          echo "ZIP_BASE=${ZIP_NAME}"     >> $GITHUB_ENV
          echo "ANYKERNEL_DIR=$(pwd)"     >> $GITHUB_ENV

      # ── 13. Upload artifact ───────────────────────────────────────────────────
      # archive: false uploads the flashable zip as-is — no wrapper, no double
      # compression, exact bytes. download-artifact names the extracted folder
      # after the artifact, so the name is deliberately not "*.zip" to keep the
      # folder from looking like a package zip.
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_BASE }}
          path: ${{ env.ANYKERNEL_DIR }}/${{ env.ZIP_NAME }}.zip
          archive: false
          retention-days: 30

      - name: Send Kernel ZIP to Telegram
        if: (success()) && ((env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') && github.event.inputs.notify_telegram != 'off')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ZIP_PATH="${ANYKERNEL_DIR}/${ZIP_NAME}.zip"
          duration_min=$(( BUILD_DURATION / 60 ))
          duration_sec=$(( BUILD_DURATION % 60 ))
          NOTE="${{ github.event.inputs.custom_note }}"

          # Helper: escape MarkdownV2 special characters
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }

          ZIP_ESC=$(esc "${ZIP_NAME}.zip")
          VER_ESC=$(esc "${KERNEL_VERSION}")
          BRANCH_ESC=$(esc "${KERNEL_BRANCH}")
          COMMIT_ESC=$(esc "${KERNEL_COMMIT}")
          SIZE_ESC=$(esc "${IMAGE_SIZE_MB} MB")
          TIME_ESC=$(esc "${duration_min}m ${duration_sec}s")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          CAPTION_FILE=$(mktemp)

          # ── Header ────────────────────────────────────────────────────────────
          printf "✅ *Build Successful — salaa*\n" >> "$CAPTION_FILE"
          printf "━━━━━━━━━━━━━━━━━━━━\n"           >> "$CAPTION_FILE"
          printf "\`%s\`\n\n"  "${ZIP_ESC}"         >> "$CAPTION_FILE"

          # ── Kernel info ───────────────────────────────────────────────────────
          printf "📱 *Device*      \`Realme 7/Narzo 20 Pro/Narzo 30 4G \(salaa\)\`\n" >> "$CAPTION_FILE"
          printf "🔩 *Kernel*      \`%s\`\n" "${VER_ESC}"   >> "$CAPTION_FILE"
          printf "🌿 *Branch*      \`%s\`\n" "${BRANCH_ESC}" >> "$CAPTION_FILE"
          printf "🔖 *Commit*      \`%s\`\n" "${COMMIT_ESC}" >> "$CAPTION_FILE"
          printf "📦 *Image size*  \`%s\`\n" "${SIZE_ESC}"   >> "$CAPTION_FILE"
          printf "⏱ *Build time*  \`%s\`\n"  "${TIME_ESC}"  >> "$CAPTION_FILE"

          # ── KernelSU block ────────────────────────────────────────────────────
          printf "\n"                                         >> "$CAPTION_FILE"
          if [ "${{ github.event.inputs.enable_ksu }}" == "true" ]; then
            KSU_VARIANT_ESC=$(esc "${KSU_VARIANT}")
            KSU_BRANCH_ESC=$(esc "${KSU_BRANCH}")
            KSU_COMMIT_ESC=$(esc "${KSU_COMMIT}")
            
            # Conditionally route the manager download links
            if [ "${KSU_VARIANT}" == "BakaSU" ]; then
              MANAGER_DL="https://t.me/BakaSU_grp/4"
              SPOOFED_MANAGER_DL="https://t.me/BakaSU_grp/5"
            else
              MANAGER_DL="${KSU_REPO}/releases/latest"
            fi

            printf "🛡 *KernelSU*\n"                                               >> "$CAPTION_FILE"
            printf "   • *Variant*  \`%s\`\n"  "${KSU_VARIANT_ESC}"               >> "$CAPTION_FILE"
            printf "   • *Branch*   \`%s\`\n"  "${KSU_BRANCH_ESC}"                >> "$CAPTION_FILE"
            printf "   • *Commit*   \`%s\`\n"  "${KSU_COMMIT_ESC}"                >> "$CAPTION_FILE"

            if [ "${SUSFS_ENABLED}" == "true" ]; then
              if [ "${SUSFS_DRIVER_MODE}" == "no_ksu_driver" ]; then
                printf "   • *SUSFS*    \`Enabled \(No KSU driver\)\`\n"           >> "$CAPTION_FILE"
              else
                printf "   • *SUSFS*    \`Enabled \(With KSU driver\)\`\n"         >> "$CAPTION_FILE"
              fi
            else
              printf "   • *SUSFS*    \`Disabled\`\n"                              >> "$CAPTION_FILE"
            fi
            
            # Output Manager links based on variant
            if [ "${KSU_VARIANT}" == "BakaSU" ]; then
              printf "   • *Manager*  [Download](%s)\n" "${MANAGER_DL}"             >> "$CAPTION_FILE"
              printf "   • *Spoofed Manager*  [Download](%s)\n" "${SPOOFED_MANAGER_DL}" >> "$CAPTION_FILE"
            else
              printf "   • *Manager*  [Download](%s)\n" "${MANAGER_DL}"             >> "$CAPTION_FILE"
            fi
          else
            printf "🛡 *KernelSU*   \`Stock \(No root\)\`\n"                       >> "$CAPTION_FILE"
          fi

          # ── Optional note ─────────────────────────────────────────────────────
          if [ -n "$NOTE" ]; then
            NOTE_ESC=$(esc "$NOTE")
            printf "\n📝 *Note*  %s\n" "${NOTE_ESC}" >> "$CAPTION_FILE"
          fi

          # ── Footer ────────────────────────────────────────────────────────────
          printf "\n━━━━━━━━━━━━━━━━━━━━\n"                                        >> "$CAPTION_FILE"
          printf "[🔗 View Run](%s)\n" "${RUN_URL}"                                 >> "$CAPTION_FILE"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F parse_mode="MarkdownV2" \
            -F "caption=<${CAPTION_FILE}" \
            -F "document=@${ZIP_PATH}"

          rm -f "$CAPTION_FILE"

      - name: Send Failure Notification to Telegram
        if: (failure()) && ((env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') && github.event.inputs.notify_telegram != 'off')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          esc() { printf '%s' "$1" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g'; }

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTE="${{ github.event.inputs.custom_note }}"

          if [ "${{ github.event.inputs.enable_ksu }}" == "true" ]; then
            VARIANT_TAG="${{ github.event.inputs.ksu_variant }}"
            if [ "${{ github.event.inputs.enable_susfs }}" == "true" ]; then
              VARIANT_TAG="${VARIANT_TAG} + SUSFS"
            fi
          else
            VARIANT_TAG="Stock"
          fi

          VARIANT_ESC=$(esc "$VARIANT_TAG")
          BRANCH_ESC=$(esc "${{ github.event.inputs.kernel_branch }}")
          COMMIT_ESC=$(esc "${KERNEL_COMMIT:-N/A}")

          MSG_FILE=$(mktemp)
          printf "❌ *Build Failed — salaa*\n"                    >> "$MSG_FILE"
          printf "━━━━━━━━━━━━━━━━━━━━\n"                          >> "$MSG_FILE"
          printf "📱 *Device* \`Realme 7/Narzo 20 Pro/Narzo 30 4G \(salaa\)\`\n"           >> "$MSG_FILE"
          printf "🔧 *Variant* \`%s\`\n" "${VARIANT_ESC}"         >> "$MSG_FILE"
          printf "🌿 *Branch* \`%s\`\n" "${BRANCH_ESC}"          >> "$MSG_FILE"
          printf "🔖 *Commit* \`%s\`\n" "${COMMIT_ESC}"          >> "$MSG_FILE"

          if [ -n "$NOTE" ]; then
            NOTE_ESC=$(esc "$NOTE")
            printf "\n📝 *Note* %s\n" "${NOTE_ESC}" >> "$MSG_FILE"
          fi

          printf "\n━━━━━━━━━━━━━━━━━━━━\n"                         >> "$MSG_FILE"
          printf "[🔍 View Logs on GitHub](%s)\n" "${RUN_URL}"       >> "$MSG_FILE"

          # Standard file upload logic
          if [ -f "kernel/build.log" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F parse_mode="MarkdownV2" \
              -F "caption=<${MSG_FILE}" \
              -F "document=@kernel/build.log"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="MarkdownV2" \
              -d disable_web_page_preview=true \
              --data-urlencode "text@${MSG_FILE}"
          fi

          rm -f "$MSG_FILE"
