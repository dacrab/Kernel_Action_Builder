name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        type: string
      build_run_id:
        description: 'Build workflow run ID to attach the kernel zip from (optional)'
        required: false
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub serves artifacts as a wrapper zip, so the real AnyKernel3 package
      # is one level down. Unwrap it here so the release asset is flashable.
      - name: Download built kernel
        if: inputs.build_run_id != ''
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl

      - name: Unwrap artifact
        if: inputs.build_run_id != ''
        run: |
          mkdir -p assets
          find dl -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            if unzip -l "$f" | grep -q 'META-INF/com/google/android/update-binary'; then
              cp "$f" assets/                       # already a flashable package
            else
              unzip -j -o "$f" '*.zip' -d assets/   # wrapper -> inner package
            fi
          done
          ls -l assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          files: assets/*.zip
          fail_on_unmatched_files: false
          body: |
            ## salaa Kernel Release

            **Device:** Realme 7/Narzo 20 Pro/Narzo 30 4G

            ### Downloads

            Check the Assets section below for kernel builds.

            ### Variants Available:
            - **Stock**: No KernelSU
            - **RKSU**: Rissu's KernelSU
            - **RKSU-SUSFS**: RKSU with SUSFS
            - **xxKSU**: backslashxx's KernelSU
            - **SukiSU**: SukiSU-Ultra
            - **SukiSU-SUSFS**: SukiSU with SUSFS
            - **BakaSU**: BakaSU (SUSFS built-in)

            ### Installation:
            1. Download the appropriate zip (do **not** rename or re-zip it)
            2. Reboot to recovery
            3. Flash zip
            4. Reboot
            5. Install KSU Manager (for KSU variants)

            ### Notes:
            - Flash at your own risk
            - Make sure you have a backup
            - Use TWRP/OrangeFox recovery

            ---
            Built with ❤️ using GitHub Actions
          prerelease: ${{ inputs.prerelease }}
          draft: false

      - name: Send Telegram Notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🎉 *New Release Created!*%0A%0A"
          MESSAGE+="*Tag:* \`${{ inputs.tag_name }}\`%0A"
          MESSAGE+="*Release:* ${{ inputs.release_name }}%0A"
          MESSAGE+="*Repository:* ${{ github.repository }}%0A"
          MESSAGE+="%0A🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag_name }})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=false
