name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name'
        required: true
        type: string
      build_run_id:
        description: 'Build workflow run ID to attach the kernel zip from (optional)'
        required: false
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The build uploads with `archive: false`, so a download is the exact
      # flashable zip, but named without .zip so it is not auto-extracted.
      # Older runs produced a wrapper zip or an extracted directory.
      - name: Download built kernel
        if: inputs.build_run_id != ''
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl

      - name: Collect kernel package
        if: inputs.build_run_id != ''
        run: |
          mkdir -p assets
          # A package contains a flashable update-binary; a wrapper zip does not.
          # Expand wrappers in place until only packages remain. (A *directory*
          # can be named "*.zip" — download-artifact does that — so only test files.)
          is_package() { unzip -l "$1" 2>/dev/null | grep -q 'META-INF/com/google/android/update-binary'; }
          while :; do
            found=""
            for f in $(find dl -type f \( -name '*.zip' -o -name 'Stormbreaker-salaa-*' \)); do
              is_package "$f" || found="$found $f"
            done
            [ -n "$found" ] || break
            for f in $found; do
              unzip -j -o "$f" '*.zip' -d "$(dirname "$f")" >/dev/null && rm -f "$f"
            done
          done
          find dl -type f -name '*.zip' -exec cp -n {} assets/ \;
          # The build uploads the package as .zipx (so a download stays raw):
          # restore the .zip name. Skip files inside an extracted package.
          is_pkg_dir_file() { case "$1" in */META-INF/*) return 0 ;; esac; return 1; }
          find dl -type f \! -name '*.zip' -printf '%p\n' | while IFS= read -r f; do
            is_pkg_dir_file "$f" && continue
            is_package "$f" || continue
            n="$(basename "$f")"; n="${n%.zipx}"
            cp -n "$f" "assets/$n.zip"
          done
          # download-artifact extracts straight into dl/ (or a directory named
          # after the artifact). Rebuild the package from whichever it used:
          # take every root whose META-INF sits at a fixed distance from it.
          for base in dl dl/*/; do
            base="${base%/}"
            [ -f "$base/META-INF/com/google/android/update-binary" ] || continue
            n="$(basename "$base")"
            case "$n" in dl) n=kernel ;; *) n="${n%.zipx}"; n="${n%.zip}"; n="${n%.kernel}" ;; esac
            (cd "$base" && zip -qr9 "$OLDPWD/assets/$n.zip" .)
          done
          test -n "$(ls -A assets)" || { echo "::error::no kernel package found in run"; exit 1; }
          echo "--- downloaded ---"; find dl -maxdepth 2 | head -20
          ls -l assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          files: assets/*.zip
          body: |
            ## salaa Kernel Release

            **Device:** Realme 7/Narzo 20 Pro/Narzo 30 4G

            ### Installation
            1. Download the zip for your variant (do **not** re-zip it)
            2. Reboot to recovery (TWRP/OrangeFox)
            3. Flash the zip, then reboot
            4. For KernelSU variants, install the matching manager afterwards

            Variant is in the file name: `Stock`, `<KSU>`, `<KSU>-SUSFS`, or
            `<KSU>-SUSFS_NoDriver`. Flash at your own risk; keep a backup.
          prerelease: ${{ inputs.prerelease }}
          draft: false

      - name: Send Telegram Notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🎉 *New Release Created!*%0A%0A"
          MESSAGE+="*Tag:* \`${{ inputs.tag_name }}\`%0A"
          MESSAGE+="*Release:* ${{ inputs.release_name }}%0A"
          MESSAGE+="*Repository:* ${{ github.repository }}%0A"
          MESSAGE+="%0A🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag_name }})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=false
